# nginx 站点配置：仅静态文件服务
# 页面：https://maas-dev.chinasatnet.com.cn/ldxq/  → 公司网关 → 本容器（保留完整路径）
# 接口：https://maas-dev.chinasatnet.com.cn:8089/ldxq_backend/api/ → 公司网关直连后端容器，
#       不经过本 nginx，因此这里不需要 /api 反代规则

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 带指纹的静态资源长期缓存（dist 实际位于 html/ldxq/ 下）
    location /ldxq/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 静态文件：/ldxq/ 及其资源直接命中 html/ldxq/ 目录
    # 前端为 hash 路由（/#/xxx），服务端只会收到 /ldxq/ 一个页面请求，无需 history 回退
    location / {
        try_files $uri $uri/ /ldxq/index.html;
    }
}
