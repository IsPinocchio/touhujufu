# 服务端配置文件：相当于前端的环境变量 + vite 配置
# 线上部署时建议用环境变量覆盖敏感项，不要把真实密码提交到仓库

server:
  port: 8080 # 后端服务端口，前端通过 http://服务器IP:8080/api/... 访问
  servlet:
    # 接口上下文前缀：本地开发为 /（无前缀）；
    # 线上由环境变量 CONTEXT_PATH 设为 /ldxq_backend，使后端直接匹配
    # 完整路径 /ldxq_backend/api/**，公司网关只需原样转发，无需剥离前缀
    context-path: ${CONTEXT_PATH:/}

spring:
  application:
    name: touhu-server
  datasource:
    # 数据库连接串：touhu 为数据库名，先在 MySQL 里执行 CREATE DATABASE touhu DEFAULT CHARSET utf8mb4;
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/touhu?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
  sql:
    init:
      # 启动时自动执行建表脚本（脚本内均为 CREATE TABLE IF NOT EXISTS / 幂等 ALTER，重复执行无副作用）
      mode: always
      schema-locations: classpath:db/schema.sql,classpath:db/seed_questions.sql
      # 脚本出错直接启动失败，不掩盖真实问题（所有语句已保证幂等）
      continue-on-error: false

mybatis-plus:
  configuration:
    # 打印 SQL 日志，开发期排查问题用；上线后可改为 none
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true # 数据库下划线列名自动映射 Java 驼峰字段
  global-config:
    banner: false

# 自定义配置
touhu:
  cors:
    # 允许跨域调用接口的前端来源（页面与接口不同端口部署时必需），逗号分隔多个
    allowed-origins: ${CORS_ORIGINS:*}
  jwt:
    # JWT 签名密钥：至少 32 个字符。线上务必用环境变量覆盖！
    secret: ${JWT_SECRET:touhu-anti-corruption-secret-key-change-me-in-prod}
    expire-days: 7 # 登录令牌有效期（天）
  purge:
    # 大清洗定时任务 cron：默认每周一凌晨 3 点执行
    # 6 个字段依次为：秒 分 时 日 月 星期
    cron: ${PURGE_CRON:0 0 3 * * MON}
