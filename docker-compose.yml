# 部署编排：mysql + backend 两个服务
# 前端不走容器：dist 静态文件由公司网关直接伺候（部署在 /ldxq/ 路径下）
# 敏感项从 .env 文件读取（复制 .env.example 为 .env 后填写真实值）
# 使用方式：
#   1. docker load -i deploy/images/touhu-server-1.0.0-arm64.tar
#      docker load -i deploy/images/mysql-8.4-arm64.tar
#   2. 复制 .env.example 为 .env，填写密码
#   3. docker compose up -d

services:
  mysql:
    image: mysql:8.4
    container_name: touhu-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      MYSQL_DATABASE: touhu # 首次启动自动建库，表结构由后端启动脚本负责
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql # 数据持久化：容器删了数据还在
    networks:
      - touhu
    # 不暴露端口到宿主机，只允许内部容器访问；需要外部连库时再加 ports: ["3306:3306"]
    # 若改用公司现有 MySQL：删除本服务，把下方 backend 的 DB_HOST 改为数据库服务器地址

  backend:
    image: touhu-server:1.0.0
    container_name: touhu-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql # 用自带 MySQL 容器时为容器名 mysql；接现有库时改成数据库服务器 IP
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-*} # 允许跨域的前端来源
      CONTEXT_PATH: ${CONTEXT_PATH:-/ldxq_backend} # 接口前缀，与网关 /ldxq_backend/ 原样转发配套
      TZ: Asia/Shanghai
    volumes:
      - ./deploy/config:/app/config:ro # 外挂配置挂载点：改此目录下 application.yml 后重启容器生效
    ports:
      # 公司网关的 /ldxq_backend/ 原样转发到 本机IP:BACKEND_PORT（proxy_pass 不带斜杠，无需剥离前缀）
      - "${BACKEND_PORT:-18081}:8080"
    depends_on:
      - mysql
    networks:
      - touhu

networks:
  touhu:

volumes:
  mysql-data:
